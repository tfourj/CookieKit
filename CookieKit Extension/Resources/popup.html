<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CookieKit</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <main>
        <header class="header">
            <img
                class="app-icon"
                src="images/icon-64.png"
                width="48"
                height="48"
                alt=""
            >
            <div>
                <h1 data-i18n="popup_title">Export cookies</h1>
                <p class="subtitle" data-i18n="popup_subtitle">Netscape cookies.txt</p>
            </div>
        </header>

        <aside class="warning" role="note">
            <svg aria-hidden="true" viewBox="0 0 24 24">
                <path
                    d="M12 3.5 21 20H3L12 3.5Zm0 5.5v5.5m0 3v.1"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                />
            </svg>
            <p data-i18n="security_warning">
                Cookies can grant account access. Share only with trusted destinations.
            </p>
        </aside>

        <section id="status" class="status-card" data-state="loading" aria-live="polite">
            <span class="status-indicator" aria-hidden="true"></span>
            <div>
                <h2 id="status-title" data-i18n="loading_title">
                    Reading this page’s cookies…
                </h2>
                <p id="status-body" data-i18n="loading_body">
                    CookieKit keeps them in memory only.
                </p>
                <p id="omitted-warning" class="omitted-warning" hidden></p>
            </div>
        </section>

        <div class="actions">
            <button id="share-button" class="primary" type="button" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path
                        d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13v6.5h14V13"
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                    />
                </svg>
                <span data-i18n="share_button">Share file</span>
            </button>
            <button id="copy-button" class="secondary" type="button" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path
                        d="M8 8V4h12v12h-4M4 8h12v12H4V8Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-linejoin="round"
                        stroke-width="2"
                    />
                </svg>
                <span id="copy-label" data-i18n="copy_button">Copy contents</span>
            </button>
            <button
                id="show-cookies-button"
                class="secondary"
                type="button"
                aria-controls="cookie-viewer"
                aria-expanded="false"
                disabled
            >
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path
                        d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Zm9.5 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                    />
                </svg>
                <span id="show-cookies-label" data-i18n="show_cookies_button">
                    Show cookies
                </span>
            </button>
        </div>

        <section
            id="cookie-viewer"
            class="cookie-viewer"
            aria-labelledby="cookie-table-title"
            hidden
        >
            <h2 id="cookie-table-title" data-i18n="cookie_table_title">
                Cookies for this page
            </h2>
            <div class="cookie-table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col" data-i18n="cookie_key_header">Key</th>
                            <th scope="col" data-i18n="cookie_value_header">Value</th>
                        </tr>
                    </thead>
                    <tbody id="cookie-table-body"></tbody>
                </table>
            </div>
        </section>

        <p id="action-notice" class="action-notice" role="status" hidden></p>
    </main>
</body>
</html>
